@keyframes breathe{from{transform:scale(1);filter:brightness(.97)}to{transform:scale(1.07);filter:brightness(1.05)}}
.go .sheet{opacity:0;pointer-events:none}

/* book cover + glow */
.coverwrap{position:absolute;left:50%;top:50%;width:min(62cqw,38cqh);aspect-ratio:5/8;
  transform:translate(-50%,-50%);opacity:0;animation:coverIn 3.6s ease .8s forwards}
@keyframes coverIn{to{opacity:1}}
.glow{position:absolute;inset:-32% -58%;transition:opacity 1.6s ease,transform 2.2s cubic-bezier(.5,0,.2,1)}
.glow i{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,222,140,.85) 0%,rgba(255,208,105,.42) 52%,rgba(255,200,90,0) 100%);
  animation:pulse 5s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.7;transform:scale(.96)}to{opacity:1;transform:scale(1.04)}}
.cover{position:absolute;inset:0;border:0;background:none;cursor:pointer;display:block;
  box-shadow:0 0 40px 8px rgba(255,214,120,.55),0 0 100px 34px rgba(255,200,90,.32),0 16px 40px rgba(0,0,0,.35);
  transition:transform 2s cubic-bezier(.5,0,.2,1),opacity 1.7s ease .1s}
.cover img{display:block;width:100%;height:100%;object-fit:cover}
.cover:focus-visible{outline:2px solid #fff;outline-offset:6px}
.go .cover{transform:scale(3.8);opacity:0;pointer-events:none}
.go .glow{transform:scale(3.2);opacity:0}

/* hand + card slide up from the bottom */
.hand{position:absolute;left:50%;bottom:0;width:min(94cqw,calc(66cqh * 0.6350));
  container-type:inline-size;display:block;text-decoration:none;
  transform:translate(-50%,108%);pointer-events:none}
.hand img{display:block;width:100%;height:auto;filter:drop-shadow(0 16px 28px rgba(0,0,0,.6))}
.hand-in .hand{transform:translate(-50%,0);transition:transform 7s cubic-bezier(.16,.6,.3,1)}
.ready .hand{pointer-events:auto;cursor:pointer}
.hand:focus-visible{outline:2px solid #fff;outline-offset:-4px}
.note{position:absolute;left:14.54%;top:7.69%;width:62.78%;height:20.28%;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:'Great Vibes','Snell Roundhand','Brush Script MT',cursive;
  font-size:8.8cqw;line-height:1.15;color:#5b2127;opacity:0;transition:opacity 2.4s ease}
.ready .note{opacity:1}

@media (prefers-reduced-motion:reduce){
  .sheet,.glow i{animation:none}
  .hand-in .hand{transition-duration:1.5s}
}
</style>

  function tone(freq,t0,dur,peak,attack,lpf){
    var o=ctx.createOscillator(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    o.type='sine'; o.frequency.setValueAtTime(freq,t0);
    f.type='lowpass'; f.frequency.value=lpf||2400;
    g.gain.setValueAtTime(.0001,t0);
    g.gain.exponentialRampToValueAtTime(peak,t0+attack);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(f); f.connect(g); g.connect(master);
    o.start(t0); o.stop(t0+dur+.05);
  }
  function click(){
    if(!audio()) return; var t=ctx.currentTime;
    tone(660,t,.35,.10,.006,2200); tone(990,t,.22,.035,.006,2200);
  }
  function whoosh(){
    if(!audio()) return; var t=ctx.currentTime, len=Math.floor(ctx.sampleRate*2.4);
    var buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
    var src=ctx.createBufferSource(); src.buffer=buf;
    var bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=.7;
    bp.frequency.setValueAtTime(250,t); bp.frequency.exponentialRampToValueAtTime(1500,t+1.8);
    var g=ctx.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.045,t+.9);
    g.gain.exponentialRampToValueAtTime(.0001,t+2.2);
    src.connect(bp); bp.connect(g); g.connect(master); src.start(t); src.stop(t+2.4);
    tone(220,t,2.4,.05,.8,900); tone(330,t+.1,2.3,.035,.8,900);
  }
  function swell(){
    if(!audio()) return; var t=ctx.currentTime;
    [196,247,294].forEach(function(f,i){ tone(f,t+i*.2,7.4,.035,3.5,800); });
  }
  function chime(){
    if(!audio()) return; var t=ctx.currentTime;
    tone(784,t,2.8,.05,.01,3000); tone(1175,t+.12,2.6,.03,.01,3000); tone(1568,t+.26,2.2,.014,.01,3000);
  }

  function showNote(){
    if(body.classList.contains('ready')) return;
    body.classList.add('ready'); chime();
  }

  function start(){
    if(body.classList.contains('go')) return;
    audio(); click(); whoosh();
    body.classList.add('go');
    setTimeout(function(){
      body.classList.add('hand-in'); swell();
      setTimeout(showNote,8200); /* fallback if the transition event never fires */
    },1900);
  }

  cover.addEventListener('click',start);
  hand.addEventListener('transitionend',function(e){
    if(e.target===hand && e.propertyName==='transform') showNote();
  });
  hand.addEventListener('click',click);
})();
</script>
